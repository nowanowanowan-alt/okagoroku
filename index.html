<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>鉄緑会大阪校名言集</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-inner">
        <h1>鉄緑会大阪校 語録</h1>
        <p>TRT / OK</p>
    </div>
</header>


<main class="container">

    <!-- 検索 -->
    <section class="search-section">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="単語・読み・意味を検索..."
                autocomplete="off"
            >

            <button id="searchButton">
                検索
            </button>
        </div>

        <div class="search-options">
            <label>
                <input type="radio" name="searchType" value="all" checked>
                すべて
            </label>

            <label>
                <input type="radio" name="searchType" value="word">
                単語
            </label>

            <label>
                <input type="radio" name="searchType" value="reading">
                読み
            </label>

            <label>
                <input type="radio" name="searchType" value="meaning">
                意味
            </label>
        </div>

    </section>


    <!-- 検索結果 -->
    <section class="result-section">

        <div class="result-header">
            <h2>検索結果</h2>
            <span id="resultCount">0件</span>
        </div>

        <div id="resultList" class="result-list">
            <!-- JavaScriptでここに表示 -->
        </div>

    </section>

</main>


<footer class="footer">
    <p>My Dictionary</p>
</footer>


<script src="dictionary.js" defer></script>

</body>
</html>
