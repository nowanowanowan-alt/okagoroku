<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>鉄緑会大阪校名言集</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-inner">
        <h1>鉄緑会大阪校 語録</h1>
        <p>TRT / OK</p>
    </div>
</header>


<main class="container">

    <!-- 検索 -->
    <section class="search-section">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="単語・意味・用例・備考を検索..."
                autocomplete="off"
            >

            <button id="searchButton">
                検索
            </button>
        </div>

        <div class="search-options">

            <label>
                <input type="radio" name="searchType" value="all" checked>
                すべて
            </label>

            <label>
                <input type="radio" name="searchType" value="word">
                単語
            </label>

            <label>
                <input type="radio" name="searchType" value="meaning">
                意味
            </label>

        </div>

    </section>


    <!-- 語録を提案 -->
    <section class="suggest-section">

        <button id="suggestButton" class="suggest-button">
            ＋ 語録を提案する
        </button>

    </section>


    <!-- 検索結果 -->
    <section class="result-section">

        <div class="result-header">
            <h2>検索結果</h2>
            <span id="resultCount">0件</span>
        </div>

        <div id="resultList" class="result-list">
            <!-- JavaScriptでここに表示 -->
        </div>

    </section>

</main>


<!-- 提案フォーム -->
<div id="suggestModal" class="suggest-modal">

    <div class="suggest-modal-content">

        <div class="suggest-header">

            <h2>語録を提案する</h2>

            <button
                id="cancelSuggest"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="suggest-form">

            <!-- 種類 -->
            <label>
                種類

                <div class="suggest-type">

                    <label>
                        <input
                            type="radio"
                            name="suggestType"
                            value="OK"
                            checked
                        >
                        OK
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="suggestType"
                            value="TRT"
                        >
                        TRT
                    </label>

                </div>

            </label>


            <!-- 単語 -->
            <label>
                単語

                <input
                    type="text"
                    id="suggestWord"
                    placeholder="例：一考"
                >
            </label>


            <!-- 意味 -->
            <label>
                意味

                <textarea
                    id="suggestMeaning"
                    placeholder="意味を入力"
                ></textarea>
            </label>


            <!-- 用例 -->
            <label>
                用例

                <textarea
                    id="suggestExample"
                    placeholder="実際の発言・用例など"
                ></textarea>
            </label>


            <!-- 備考 -->
            <label>
                備考

                <textarea
                    id="suggestNote"
                    placeholder="補足など（任意）"
                ></textarea>
            </label>


            <!-- 名前 -->
            <label>
                名前
                <span class="optional">任意</span>

                <input
                    type="text"
                    id="suggestName"
                    placeholder="空欄なら匿名"
                >
            </label>


            <button
                id="submitSuggest"
                class="submit-suggest-button"
                type="button"
            >
                提案する
            </button>

        </div>

    </div>

</div>


<footer class="footer">
    <p>Tetsuryokukai Goroku</p>
</footer>


<script src="dictionary.js" defer></script>

</body>
</html>
```
